<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 园之助 GEO</title><link rel="stylesheet" href="styles_v3.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#0b3b2e}.login{width:min(420px,calc(100% - 32px));background:#fff;border-radius:18px;padding:30px;box-shadow:0 24px 80px #001b1266}.login .brand-mark{margin-bottom:20px}.login h1{font-size:1.5rem;margin:0 0 6px}.login p{color:#65736d;font-size:.84rem}.login form{display:grid;gap:14px;margin-top:24px}.login label{font-size:.78rem;color:#65736d}.login input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #dfe7e2;border-radius:9px}.login button{margin-top:4px;padding:11px}.error{color:#b13f38;background:#ffedeb;border-radius:8px;padding:9px;font-size:.78rem}</style></head><body><main class="login"><span class="brand-mark">园</span><h1>园之助 GEO 增长操作系统</h1><p>使用公司账号进入品牌、商品与 AI 可见性工作台。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><div class="error hidden" id="error"></div><button class="primary">安全登录</button></form></main><script src="login.js"></script></body></html>
